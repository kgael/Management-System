<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Meta tags para PWA -->
    <meta name="theme-color" content="#2563EB" />
    <meta name="description" content="Sistema de inventario de medicamentos para Clínica Santa Cruz" />
    
    <!-- Apple specific meta tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Inventario Clínica" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-512x512.png" />
    <link rel="icon" type="image/png" href="/icons/icon-512x512.png" />
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <title>Inventario - Clínica Santa Cruz</title>
    
    <style>
      /* Loading screen para PWA */
      .pwa-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: white;
        font-family: Arial, sans-serif;
      }
      .pwa-loading h1 {
        margin-bottom: 20px;
        font-size: 24px;
      }
      .pwa-loading .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255,255,255,0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Mejoras para TV y pantallas grandes */
      @media (min-width: 1920px) {
        body {
          font-size: 18px;
        }
        .sidebar {
          width: 320px;
        }
      }
      
      @media (min-width: 3840px) {
        body {
          font-size: 24px;
        }
        .sidebar {
          width: 400px;
        }
      }

      /* Breakpoint extra pequeño para móviles */
      @media (max-width: 360px) {
        .text-xs {
          font-size: 0.7rem;
        }
      }

      /* Smooth transitions para el sidebar */
      .sidebar-transition {
        transition: transform 0.3s ease-in-out;
      }

      /* Mejor scroll para sidebar */
      .sidebar-scroll {
        scrollbar-width: thin;
        scrollbar-color: #cbd5e1 #f1f5f9;
      }

      .sidebar-scroll::-webkit-scrollbar {
        width: 4px;
      }

      .sidebar-scroll::-webkit-scrollbar-track {
        background: #f1f5f9;
      }

      .sidebar-scroll::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <!-- Loading screen inicial -->
    <div id="pwa-loading" class="pwa-loading">
      <h1>🩺 Clínica Santa Cruz</h1>
      <div class="spinner"></div>
      <p style="margin-top: 20px;">Cargando aplicación...</p>
    </div>

    <div id="root"></div>
    
    <script>
      // Registrar Service Worker MEJORADO
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          // Ruta absoluta para el Service Worker
          navigator.serviceWorker.register('/sw.js')
            .then(function(registration) {
              console.log('✅ Service Worker registrado con éxito:', registration.scope);
              
              // Verificar si hay una nueva versión
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                console.log('🔄 Nueva versión del Service Worker encontrada');
                
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('📱 Nueva versión lista. Recarga para actualizar.');
                    // Puedes mostrar un botón para actualizar
                    showUpdateNotification();
                  }
                });
              });
              
              // Ocultar loading screen
              hideLoadingScreen();
            })
            .catch(function(error) {
              console.log('❌ Error registrando Service Worker:', error);
              hideLoadingScreen();
            });
        });

        // Verificar actualizaciones periódicamente
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          console.log('🔄 Controller changed - probable actualización');
          window.location.reload();
        });
      } else {
        hideLoadingScreen();
      }

      function hideLoadingScreen() {
        setTimeout(() => {
          const loading = document.getElementById('pwa-loading');
          if (loading) {
            loading.style.display = 'none';
          }
        }, 800);
      }

      function showUpdateNotification() {
        // Implementar notificación de actualización si lo deseas
        if (confirm('¡Nueva versión disponible! ¿Recargar para actualizar?')) {
          window.location.reload();
        }
      }

      // Detectar si la app se está ejecutando en modo standalone (PWA)
      if (window.matchMedia('(display-mode: standalone)').matches) {
        console.log('📱 Ejecutando en modo PWA');
        document.body.classList.add('pwa-mode');
      }

      // Manejar el evento de antes de instalar
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        console.log('📲 PWA lista para instalar');
        
        // Puedes mostrar un botón de instalación aquí
        showInstallPromotion();
      });

      function showInstallPromotion() {
        // Aquí puedes agregar un botón para instalar la PWA
        console.log('Mostrar promoción de instalación');
        // Ejemplo: mostrar un banner de instalación
        const installBanner = document.createElement('div');
        installBanner.innerHTML = `
          <div style="position: fixed; bottom: 0; left: 0; right: 0; background: #2563EB; color: white; padding: 10px; text-align: center; z-index: 10000;">
            <p>¿Instalar la aplicación? <button onclick="installPWA()" style="background: white; color: #2563EB; border: none; padding: 5px 10px; border-radius: 5px; margin-left: 10px;">Instalar</button></p>
          </div>
        `;
        document.body.appendChild(installBanner);
        
        // Remover después de 10 segundos
        setTimeout(() => {
          if (installBanner.parentNode) {
            installBanner.parentNode.removeChild(installBanner);
          }
        }, 10000);
      }

      // Función global para instalar PWA
      window.installPWA = function() {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then((choiceResult) => {
            if (choiceResult.outcome === 'accepted') {
              console.log('Usuario aceptó la instalación');
            } else {
              console.log('Usuario rechazó la instalación');
            }
            deferredPrompt = null;
          });
        }
      };

      // Manejar el evento de instalación
      window.addEventListener('appinstalled', (evt) => {
        console.log('🎉 PWA instalada exitosamente');
        deferredPrompt = null;
        
        // Remover banner de instalación si existe
        const banners = document.querySelectorAll('[style*="position: fixed; bottom: 0"]');
        banners.forEach(banner => banner.remove());
      });
    </script>
    
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
